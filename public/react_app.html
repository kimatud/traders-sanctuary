<body>
    <div id="root"></div>

    <script type="module">
        // --- ES Module Imports (MUST be at the top-level of the module) ---
        // React core and hooks
        import React, { useState, useEffect, createContext, useContext, useRef, useMemo, useCallback } from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';

        // Firebase SDKs
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
        import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, onSnapshot, deleteDoc, addDoc, getDocs, where } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
        import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

        // Lucide React icons (for UI elements)
        import { Home, User, Mail, BarChart, BookOpen, Users, Bell, MessageSquare, Instagram, Send, KeyRound, LogIn, LogOut, UserPlus, X, CheckCircle, Settings, Edit, Trash2, Check, XCircle, FileText, NotebookText, Menu, Sun, Moon, Monitor, ChevronDown, Eye, EyeOff, Award } from 'https://esm.sh/lucide-react@0.395.0';

        // Recharts for charting (though not currently used, kept for potential future use)
        import { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } from 'https://esm.sh/recharts@2.12.7?deps=react@18.2.0,react-dom@18.2.0';

        // Three.js for 3D animation
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.min.js';

        // --- Main Application Logic (wrapped in try-catch for runtime errors) ---
        try {
            // --- Firebase Configuration & Initialization ---
            const firebaseConfig = {
                apiKey: "AIzaSyCMQ9nlvS1WPCszC8Bahzcec6WXF3F_0tE",
                authDomain: "traders-sanctuary.firebaseapp.com",
                projectId: "traders-sanctuary",
                storageBucket: "traders-sanctuary.firebaseapp.com",
                messagingSenderId: "4336211178",
                appId: "1:433621117821:web:e7996f5098b8e9c3e97a14",
                measurementId: "G-YEHJ0QBXQH"
            };
            const appId = firebaseConfig.projectId;

            let app;
            let auth;
            let db;
            let storage;

            if (Object.keys(firebaseConfig).length > 0 && firebaseConfig.apiKey) {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                storage = getStorage(app);
            } else {
                console.error("Firebase configuration not found or incomplete.");
            }
            
            // --- Auth Context ---
            const AuthContext = createContext(null);

            const AuthProvider = ({ children }) => {
                const [user, setUser] = useState(null);
                const [isAuthReady, setIsAuthReady] = useState(false);
                const [authError, setAuthError] = useState(null);

                useEffect(() => {
                    if (!auth) {
                        setIsAuthReady(true);
                        return;
                    }

                    let unsubscribeFromProfile = () => {};

                    const unsubscribeFromAuth = onAuthStateChanged(auth, async (currentUser) => {
                        unsubscribeFromProfile(); // Always clean up the previous profile listener

                        if (currentUser) {
                            const userParentDocRef = doc(db, `artifacts/${appId}/users/${currentUser.uid}`);
                            await setDoc(userParentDocRef, {}, { merge: true });
                            const userProfileDocRef = doc(db, `artifacts/${appId}/users/${currentUser.uid}/profile/data`);
                            
                            unsubscribeFromProfile = onSnapshot(userProfileDocRef, async (userProfileDocSnap) => {
                                let userWithRole = { ...currentUser };
                                if (userProfileDocSnap.exists()) {
                                    userWithRole = { ...currentUser, ...userProfileDocSnap.data() };
                                } else {
                                    const newProfile = { 
                                        email: currentUser.email, 
                                        role: 'member', 
                                        createdAt: new Date().toISOString(),
                                        displayName: currentUser.email.split('@')[0]
                                    };
                                    await setDoc(userProfileDocRef, newProfile, { merge: true });
                                    userWithRole = { ...currentUser, ...newProfile };
                                }
                                setUser(userWithRole);
                                if (!isAuthReady) setIsAuthReady(true);
                            }, (error) => {
                                console.error("AuthProvider: Error listening to user profile:", error);
                                setUser({ ...currentUser, role: 'member', displayName: 'Error Loading Profile' });
                                if (!isAuthReady) setIsAuthReady(true);
                            });

                        } else {
                            setUser(null);
                            setIsAuthReady(true);
                        }
                    });

                    return () => {
                        unsubscribeFromAuth();
                        unsubscribeFromProfile();
                    };
                }, [auth]);


                const register = async (email, password) => {
                    setAuthError(null);
                    try {
                        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                        const userParentDocRef = doc(db, `artifacts/${appId}/users/${userCredential.user.uid}`);
                        await setDoc(userParentDocRef, {}, { merge: true });

                        const userProfileRef = doc(db, `artifacts/${appId}/users/${userCredential.user.uid}/profile/data`);
                        await setDoc(userProfileRef, { 
                            email: email, 
                            role: 'member', 
                            createdAt: new Date().toISOString(),
                            displayName: email.split('@')[0]
                        });
                        return userCredential.user;
                    }
                    catch (error) {
                        setAuthError(error.message);
                        throw error;
                    }
                };

                const login = async (email, password) => {
                    setAuthError(null);
                    try {
                        return await signInWithEmailAndPassword(auth, email, password);
                    }
                    catch (error) {
                        setAuthError(error.message);
                        throw error;
                    }
                };

                const logout = async () => {
                    setAuthError(null);
                    try {
                        await signOut(auth);
                    }
                    catch (error) {
                        setAuthError(error.message);
                        throw error;
                    }
                };
                
                const resetPassword = async (email) => {
                    setAuthError(null);
                    try {
                        await sendPasswordResetEmail(auth, email);
                        return true;
                    }
                    catch (error) {
                        setAuthError(error.message);
                        throw error;
                    }
                };


                return (
                    React.createElement(AuthContext.Provider, { value: { user, isAuthReady, authError, register, login, logout, resetPassword } },
                        children
                    )
                );
            };

            // --- Global Message Modal Component ---
            const MessageModal = ({ message, type, onClose, showCloseButton }) => {
                if (!message) return null;

                const isSuccess = type === 'success';
                const lightModeTextClass = isSuccess ? 'text-green-800' : 'text-red-800';
                const bgColor = isSuccess ? 'bg-green-100 border-green-400 dark:bg-green-900/20 dark:border-green-600' : 'bg-red-100 border-red-400 dark:bg-red-900/20 dark:border-red-600';
                const icon = isSuccess ? React.createElement(CheckCircle, { className: "h-6 w-6 text-green-500" }) : React.createElement(XCircle, { className: "h-6 w-6 text-red-500" });

                return (
                    React.createElement('div', { className: "fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" },
                        React.createElement('div', { className: `bg-white dark:bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full border ${bgColor} flex flex-col items-center text-center` },
                            React.createElement('div', { className: "mb-4" },
                                icon
                            ),
                            React.createElement('p', { className: `text-lg font-semibold mb-4 ${lightModeTextClass} dark:text-gray-200` }, message),
                            showCloseButton && React.createElement('button', {
                                onClick: onClose,
                                className: "mt-2 px-6 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
                            },
                                "Close"
                            )
                        )
                    )
                );
            };

            // --- Auth Modal Component (Login, Register, Reset Password) ---
            const AuthModal = ({ show, onClose, type, onSwitchType }) => {
                const [email, setEmail] = useState('');
                const [password, setPassword] = useState('');
                const [confirmPassword, setConfirmPassword] = useState('');
                const [isPasswordVisible, setIsPasswordVisible] = useState(false);
                const [isConfirmPasswordVisible, setIsConfirmPasswordVisible] = useState(false);
                const [message, setMessage] = useState('');
                const [messageType, setMessageType] = useState('');
                const { register, login, resetPassword, authError } = useContext(AuthContext);

                const resetForm = useCallback(() => {
                    setEmail('');
                    setPassword('');
                    setConfirmPassword('');
                    setMessage('');
                    setMessageType('');
                }, []);

                useEffect(() => {
                    if (authError) {
                        setMessage(authError.replace('Firebase: ', '').replace(/ \(.+\)/, ''));
                        setMessageType('error');
                    }
                }, [authError]);

                useEffect(() => {
                    if (show) {
                        resetForm();
                    }
                }, [show, type, resetForm]);


                if (!show) return null;
                
                const handleSubmit = async (e) => {
                    e.preventDefault();
                    setMessage('');
                    setMessageType('');

                    if (type === 'register' && password !== confirmPassword) {
                        setMessage('Passwords do not match.');
                        setMessageType('error');
                        return;
                    }

                    try {
                        if (type === 'login') {
                            await login(email, password);
                            setMessage('Login successful! Redirecting...');
                            setMessageType('success');
                            setTimeout(() => onClose(), 1500);

            // --- Forex Animation Component (using Three.js) ---
            const ForexAnimation = ({ theme }) => {
                const mountRef = useRef(null);
                const isEffectiveDarkMode = useMemo(() => {
                    if (theme === 'dark') return true;
                    if (theme === 'system' && typeof window !== 'undefined') {
                        return window.matchMedia('(prefers-color-scheme: dark)').matches;

                useEffect(() => {
                    if (!mountRef.current || typeof window === 'undefined') return;

                    camera.position.z = 1;

                    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                    renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                    mountRef.current.appendChild(renderer.domElement);

                    const particles = [];
                    const particleCount = 100;
                    const pointsGeometry = new THREE.BufferGeometry();
                    const positions = new Float32Array(particleCount * 3);

                    for (let i = 0; i < particleCount; i++) {
                        const x = (Math.random() - 0.5) * 2;
                        const y = (Math.random() - 0.5) * 2;
                        const z = (Math.random() - 0.5) * 2;
                        positions[i * 3] = x;
                        positions[i * 3 + 1] = y;
                        positions[i * 3 + 2] = z;
                        particles.push({
                            position: new THREE.Vector3(x, y, z),
                            velocity: new THREE.Vector3((Math.random() - 0.5) * 0.0005, (Math.random() - 0.5) * 0.0005, 0)
                        });
                    }
                    pointsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                    
                    const particleColor = isEffectiveDarkMode ? 0x00ffff : 0x1e3a8a;
                    const pointsMaterial = new THREE.PointsMaterial({ color: particleColor, size: 3, sizeAttenuation: false });
                    const points = new THREE.Points(pointsGeometry, pointsMaterial);
                    scene.add(points);

                    const linesGeometry = new THREE.BufferGeometry();
                    const linePositions = new Float32Array(particleCount * particleCount * 3);
                    linesGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
                    
                    const lineColor = isEffectiveDarkMode ? 0x005050 : 0x93c5fd;
                    const linesMaterial = new THREE.LineBasicMaterial({ color: lineColor, transparent: true, opacity: 0 });
                    const lines = new THREE.LineSegments(linesGeometry, linesMaterial);
                    scene.add(lines);

                    const mouse = new THREE.Vector2(-10, -10);
                    const onMouseMove = (event) => {
                        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                    };
                    window.addEventListener('mousemove', onMouseMove);

                    let animationFrameId;
                    const animate = () => {
                        animationFrameId = requestAnimationFrame(animate);
                        let lineVertexIndex = 0;
                        const posAttr = points.geometry.attributes.position;
                        
                        particles.forEach((p, i) => {
                            p.position.add(p.velocity);
                            if (p.position.x < -1 || p.position.x > 1) p.velocity.x *= -1;
                            if (p.position.y < -1 || p.position.y > 1) p.velocity.y *= -1;

                            posAttr.setXYZ(i, p.position.x, p.position.y, p.position.z);

                                const p1 = particles[i].position;
                                const p2 = particles[j].position;
                                const dist = p1.distanceTo(p2);
                                if (dist < 0.3) {
                                    lines.geometry.attributes.position.setXYZ(lineVertexIndex++, p1.x, p1.y, p1.z);

                        // Interaction with mouse

                        mouseVec3.unproject(camera);
                        const dir = mouseVec3.sub(camera.position).normalize();
                        const distance = -camera.position.z / dir.z;
                        const mousePos = camera.position.clone().add(dir.multiplyScalar(distance));
                        
                        if(mouse.x !== -10){
                           for (let i = 0; i < particleCount; i++) {
                                const p = particles[i].position;
                                const distToMouse = p.distanceTo(mousePos);
                                if (distToMouse < 0.5) {
                                    lines.geometry.attributes.position.setXYZ(lineVertexIndex++, p.x, p.y, p.z);
                                    lines.geometry.attributes.position.setXYZ(lineVertexIndex++, mousePos.x, mousePos.y, mousePos.z);
                                }
                           }
                        }

                        lines.geometry.setDrawRange(0, lineVertexIndex);
                        lines.geometry.attributes.position.needsUpdate = true;
                        posAttr.needsUpdate = true;
                        
                        // Fade in animation for lines
                        if (lines.material.opacity < 1) {
                            lines.material.opacity += 0.005;
                        }

                        camera.position.x += (mouse.x * 0.5 - camera.position.x) * 0.05;
                        camera.position.y += (-mouse.y * 0.5 - camera.position.y) * 0.05;
                        camera.lookAt(scene.position);
                        
                        renderer.render(scene, camera);
                    };

                    const onWindowResize = () => {
                        if (mountRef.current) {
                            camera.aspect = mountRef.current.clientWidth / mountRef.current.clientHeight;
                            camera.updateProjectionMatrix();
                            renderer.setSize(mountRef.current.clientWidth, mountRef.current.clientHeight);
                        }
                    };

                    animate();
                    window.addEventListener('resize', onWindowResize);

                    return () => {
                        window.removeEventListener('mousemove', onMouseMove);
                        window.removeEventListener('resize', onWindowResize);
                        cancelAnimationFrame(animationFrameId);
                        if (mountRef.current && renderer.domElement) {
                            mountRef.current.removeChild(renderer.domElement);
                        }
                    };
                }, [isEffectiveDarkMode]);

                return React.createElement('div', { ref: mountRef, className: "forex-animation-canvas" });
            };

            // --- Auto-logout Hook ---
            const useIdleTimer = (onIdle, idleTime = 15 * 60 * 1000) => { // 15 minutes
                const timeoutId = useRef();

                const resetTimer = useCallback(() => {
                    clearTimeout(timeoutId.current);
                    timeoutId.current = setTimeout(onIdle, idleTime);
                }, [onIdle, idleTime]);

                useEffect(() => {
                    const events = ['mousemove', 'mousedown', 'keypress', 'scroll', 'touchstart'];

                    events.forEach(event => window.addEventListener(event, eventListener, { passive: true }));

                    if (protectedPages.includes(page) && !user) {

                    )

                                                        <h2>Oops! Something went wrong.</h2>
                                                        <p>Error: <strong>${e.message}</strong></p>
                                                        <p>Please check the browser console (F12) for details.</p>
                                                        </div>`;
        }
    </script>
